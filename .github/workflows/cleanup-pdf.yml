name: Limpiar temporales de PDF (pausado)
# Limpieza del 16-10 completada. Pausado por instrucción de no generar gasto.
# No reejecutar versiones históricas para repetir una limpieza ya verificada.
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: write
concurrency:
  group: pdf-artifact-cleanup
  cancel-in-progress: false
jobs:
  cleanup:
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Eliminar solo los temporales auditados de PDF
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/actions-cleanup.py
