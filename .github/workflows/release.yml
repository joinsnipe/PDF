name: Validar y distribuir PDF
on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/images/**'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pdf-release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: npm ci
      - run: npm ci --prefix hosting
      - run: npm run build
      - run: python -m pip install -r tests/requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y libreoffice-writer libreoffice-calc libreoffice-impress
      - run: npm test
      - run: python -B -m unittest discover -s tests -p 'test_*.py'
  release:
    needs: build
    if: github.repository == 'joinsnipe/PDF' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Comprobar si hay una versión nueva antes de empaquetar
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release-status.py
      - uses: actions/setup-node@v4
        if: steps.version.outputs.publish == 'true'
        with:
          node-version: '24.19.0'
      - uses: actions/setup-python@v5
        if: steps.version.outputs.publish == 'true'
        with:
          python-version: '3.14'
      - name: Preparar los paquetes solo para una versión nueva
        if: steps.version.outputs.publish == 'true'
        run: |
          npm ci
          npm run build:client
          python scripts/package.py
      - name: Publicar directamente en Releases, sin artefactos de Actions
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG=$(node -p "require('./release.json').tag")
          VERSION=$(node -p "require('./package.json').version")
          FLAGS=()
          if [ "$(node -p "require('./release.json').prerelease")" = "true" ]; then
            FLAGS+=(--prerelease)
          fi
          gh release create "$TAG" --draft --target "$GITHUB_SHA" --title "PDF $VERSION" --notes-file "docs/releases/$TAG.md" "${FLAGS[@]}"
          gh release upload "$TAG" artifacts/*
          gh release edit "$TAG" --draft=false
